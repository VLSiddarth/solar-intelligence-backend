[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    unit: Fast unit tests (no infrastructure needed)
    integration: Integration tests (mocked infrastructure)
    e2e: End-to-end tests (requires docker compose up -d)
    slow: Tests that take > 5 seconds
log_cli = true
log_cli_level = WARNING
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning