# ============================================================
# infra/prometheus/prometheus.yml
# Prometheus scrape config for all SI layers
# ============================================================

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    monitor: "solar-intelligence"

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []   # Add alertmanager host when configured

scrape_configs:

  # SI API (Photosphere)
  - job_name: "si-api"
    static_configs:
      - targets: ["si-api:8888"]
    metrics_path: /metrics
    scrape_interval: 10s

  # OTel Collector (Corona)
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
    scrape_interval: 15s

  # Kong Gateway (Photosphere)
  - job_name: "kong"
    static_configs:
      - targets: ["kong:8002"]
    metrics_path: /metrics
    scrape_interval: 15s

  # Redis (Convective)
  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
    scrape_interval: 15s

  # Milvus (Radiative)
  - job_name: "milvus"
    static_configs:
      - targets: ["milvus:9091"]
    scrape_interval: 30s

  # Redpanda/Kafka (Core)
  - job_name: "redpanda"
    static_configs:
      - targets: ["redpanda:9644"]
    scrape_interval: 15s